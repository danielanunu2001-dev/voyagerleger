version: '3.8'

services:
  db:
    image: postgres:15
    container_name: voyageconnect-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=voyageconnect
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - voyageconnect-data:/var/lib/postgresql/data

volumes:
  voyageconnect-data:
