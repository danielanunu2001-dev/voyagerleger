# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=VoyageConnect
server.port=8080

# ===============================
# DATASOURCE CONFIGURATION (PROD-LIKE)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/voyageconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# WEB MVC CONFIGURATION
# ===============================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===============================
# I18N CONFIGURATION
# ===============================
spring.messages.basename=i18n/messages

# ===============================
# PAYMENT PROVIDER CONFIGURATION
# ===============================
payment.provider=stub # Can be 'stripe' or 'paypal'
stripe.secret.key=${STRIPE_SECRET_KEY:ENV_PLACEHOLDER}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:ENV_PLACEHOLDER}
