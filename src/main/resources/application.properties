# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=VoyageConnect
server.port=8080

# ===============================
# DATASOURCE CONFIGURATION
# ===============================
# Utilise des variables d'environnement pour la configuration de la base de données
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:voyageconnect}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=validate # 'validate' pour vérifier que le schéma correspond aux entités
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# WEB MVC CONFIGURATION (pour JSP)
# ===============================
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ===============================
# I18N CONFIGURATION
# ===============================
spring.messages.basename=messages

# ===============================
# DATABASE INITIALIZATION
# ===============================
spring.sql.init.mode=always
