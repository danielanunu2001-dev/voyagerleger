# ===============================
# LOCAL DATASOURCE CONFIGURATION (H2)
# ===============================
spring.datasource.url=jdbc:h2:mem:voyageconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# JPA/HIBERNATE CONFIGURATION (LOCAL)
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# DATABASE INITIALIZATION
# ===============================
# Pour le profil local, on exécute toujours init.sql pour avoir des données de test
spring.sql.init.mode=always

# ===============================
# PAYMENT PROVIDER (LOCAL)
# ===============================
payment.provider=stub
